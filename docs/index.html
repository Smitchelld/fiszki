<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StackPrep — fiszki przed rozmową</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
/* VOICE: jak portfolio smitchelld.github.io, tylko na telefon
   IDEA: rolki, jedna karta = jeden ekran; odpowiedź w okienku terminala
   PICTURE: rozmyty terminal, który odsłania się po tapnięciu
   COLOUR/TYPE: #04080f, niebieski #3b82f6 + indygo, zielony = dobrze; DM Serif Display + Space Mono
   LAYOUT: stały pasek u góry (licznik, kategorie), karty przewijane w pionie ze snapem */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; min-width: 0; }
:root {
  color-scheme: dark;
  --bg: #04080f; --fg: #dde4f0; --fg-dim: #8a96aa;
  --accent: #3b82f6; --accent2: #818cf8; --green: #34d399; --red: #f87171;
  --card: rgba(255,255,255,0.03); --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
  --top: 116px;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: 'Space Mono', monospace; overflow: hidden; -webkit-tap-highlight-color: transparent; }

#bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1; opacity: .4;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  background-size: 200px; }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 2;
  background: repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.025) 3px,rgba(0,0,0,.025) 4px); }

/* ─── TOP ─── */
.top { position: fixed; top: 0; left: 0; right: 0; z-index: 20; padding: 14px max(5vw,18px) 14px;
  background: linear-gradient(to bottom, rgba(4,8,15,.96) 70%, rgba(4,8,15,0)); }
.top-in { max-width: 560px; margin: 0 auto; }
.row1 { display: flex; align-items: center; gap: 14px; }
.back { display: inline-flex; align-items: center; min-height: 34px; padding: 0 12px; border: 1px solid var(--border2); border-radius: 100px;
  font-size: .7rem; color: var(--fg-dim); letter-spacing: .06em; text-decoration: none; white-space: nowrap; transition: border-color .2s, color .2s; }
.back:hover { border-color: var(--accent); color: var(--fg); }
.back:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }
.brand { display: flex; flex-direction: column; line-height: 1.15; }
.brand-name { font-size: .88rem; font-weight: 700; color: var(--fg); letter-spacing: .04em; }
.brand-name b { color: var(--accent); }
.brand-sub { font-size: .62rem; color: var(--fg-dim); letter-spacing: .04em; white-space: nowrap; }
@media (max-width: 380px) { .brand-sub { display: none; } }
.count { margin-left: auto; font-size: .72rem; color: var(--fg-dim); letter-spacing: .1em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.icon-btn { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 1px solid var(--border2); background: var(--card);
  color: var(--fg); font: 400 1.25rem/1 'Space Mono', monospace; cursor: pointer; transition: border-color .2s, color .2s; }
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }
.bar { height: 2px; background: var(--border); margin: 12px 0; border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .3s; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 34px; padding: 6px 14px; border-radius: 100px; border: 1px solid var(--border); background: transparent;
  color: var(--fg-dim); font: 400 .72rem 'Space Mono', monospace; letter-spacing: .04em; cursor: pointer; transition: border-color .2s, color .2s; }
.chip.on { border-color: var(--accent); color: var(--fg); background: rgba(59,130,246,.12); }

/* ─── FEED ─── */
#feed { position: fixed; inset: 0; z-index: 10; overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain; scrollbar-width: none; }
#feed::-webkit-scrollbar { display: none; }
.card { position: relative; height: 100vh; height: 100dvh; overflow: hidden; scroll-snap-align: start; scroll-snap-stop: always;
  display: flex; padding: calc(var(--top) + 6px) max(5vw,18px) 34px; }
.inner { width: 100%; max-width: 520px; margin: auto; display: flex; flex-direction: column; gap: 20px; }

.eyebrow { display: flex; align-items: center; gap: 12px; font-size: .72rem; color: var(--green); letter-spacing: .2em; text-transform: uppercase; }
.eyebrow::before { content: ""; width: 24px; height: 1px; background: var(--green); }
.badge { font-size: .66rem; letter-spacing: .1em; color: var(--accent2); border: 1px solid rgba(129,140,248,.4); padding: 2px 9px; border-radius: 100px; }

.q { font-family: 'DM Serif Display', serif; font-weight: 400; font-size: clamp(1.9rem, 7.6vw, 2.7rem); line-height: 1.08; letter-spacing: -.01em; text-wrap: balance; }
.q.long { font-size: clamp(1.5rem, 6vw, 2.1rem); }
.q em { font-style: italic; background: linear-gradient(120deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
code { font-family: 'Space Mono', monospace; font-size: .92em; background: rgba(59,130,246,.13); color: #a9c8ff; padding: .08em .35em; border-radius: 4px; overflow-wrap: anywhere; }
.q code { font-size: .6em; vertical-align: .12em; white-space: nowrap; }

/* terminal, jak na portfolio */
.term { position: relative; background: rgba(0,0,0,.62); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; backdrop-filter: blur(10px); }
.term-bar { display: flex; align-items: center; gap: 7px; padding: 11px 16px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,.03); }
.d { width: 11px; height: 11px; border-radius: 50%; } .d.r { background: #ff5f57; } .d.y { background: #febc2e; } .d.g { background: #28c840; }
.term-bar span { margin-left: 8px; font-size: .68rem; color: var(--fg-dim); }
.term-body { padding: 18px 20px; min-height: 128px; font-size: .86rem; line-height: 1.85; color: #a0f0a0; }
.term-body .pr { color: var(--accent); }

.answer .term-body { filter: blur(7px); opacity: .35; user-select: none; transition: filter .35s, opacity .35s; }
.revealed .answer .term-body { filter: none; opacity: 1; user-select: text; }
.reveal { position: absolute; left: 50%; top: calc(50% + 20px); transform: translate(-50%,-50%); white-space: nowrap; }
.revealed .reveal { opacity: 0; pointer-events: none; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 12px 22px; border-radius: 3px; border: 0;
  font: 400 .8rem 'Space Mono', monospace; letter-spacing: .05em; cursor: pointer; transition: transform .2s, box-shadow .2s, border-color .2s, color .2s, opacity .2s; }
.btn-fill { background: var(--accent); color: var(--bg); font-weight: 700; }
.btn-fill:hover { box-shadow: 0 10px 40px rgba(59,130,246,.4); }
.btn-outline { background: transparent; border: 1px solid var(--border2); color: var(--fg-dim); }
.btn-outline:hover { border-color: rgba(255,255,255,.25); color: var(--fg); }
.btn:focus-visible, .chip:focus-visible, .opt:focus-visible, .icon-btn:focus-visible, .link:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }

.grade { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; visibility: hidden; opacity: 0; transform: translateY(8px); transition: opacity .3s, transform .3s, visibility .3s; }
.revealed .grade { visibility: visible; opacity: 1; transform: none; }
.done .grade .btn:not(.chosen) { opacity: .3; }
.grade .chosen.btn-outline { border-color: var(--red); color: var(--red); }

/* wybór */
.opts { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.opt { display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 12px 16px; text-align: left; border: 0; border-bottom: 1px solid var(--border);
  background: var(--card); color: var(--fg); font: 400 .86rem/1.5 'Space Mono', monospace; cursor: pointer; transition: background .2s, color .2s, opacity .2s; }
.opt:last-child { border-bottom: 0; }
.opt:hover { background: rgba(255,255,255,.055); }
.key { flex: none; width: 28px; height: 28px; display: grid; place-items: center; border: 1px solid var(--border2); border-radius: 50%; font-size: .72rem; color: var(--accent); }
.done .opt { cursor: default; }
.opt.correct { background: rgba(52,211,153,.1); } .opt.correct .key { background: var(--green); border-color: var(--green); color: var(--bg); }
.opt.wrong { background: rgba(248,113,113,.1); } .opt.wrong .key { background: var(--red); border-color: var(--red); color: var(--bg); }
.opt.dim { opacity: .45; }
.expl { padding: 14px 18px; border: 1px solid var(--border); border-radius: 10px; background: rgba(0,0,0,.5); font-size: .84rem; line-height: 1.8; color: var(--fg-dim);
  visibility: hidden; opacity: 0; transition: opacity .3s, visibility .3s; }
.done .expl { visibility: visible; opacity: 1; }
.verdict { display: block; font-weight: 700; margin-bottom: 4px; }
.verdict.ok { color: var(--green); } .verdict.no { color: var(--red); }

.scroll-hint { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px;
  font-size: .66rem; color: var(--fg-dim); letter-spacing: .18em; text-transform: uppercase; pointer-events: none; }
.scroll-hint::after { content: ""; width: 1px; height: 40px; background: linear-gradient(to bottom, var(--fg-dim), transparent); animation: drop 1.8s ease-in-out infinite; }
@keyframes drop { 0%,100% { transform: translateY(0); opacity: .5 } 50% { transform: translateY(8px); opacity: 1 } }

/* koniec sesji */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.stat { background: var(--card); padding: 22px 24px; }
.stat-val { font-family: 'DM Serif Display', serif; font-size: 2.6rem; line-height: 1; }
.stat-val.ok { color: var(--green); } .stat-val.no { color: var(--red); }
.stat-label { margin-top: 8px; font-size: .68rem; color: var(--fg-dim); letter-spacing: .1em; text-transform: uppercase; }
.muted { font-size: .84rem; line-height: 1.9; color: var(--fg-dim); }
.end .btn { align-self: flex-start; }

/* ─── FORMULARZ ─── */
.backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.55); backdrop-filter: blur(4px); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; max-width: 560px; max-height: 90dvh; margin: 0 auto; overflow-y: auto;
  display: flex; flex-direction: column; gap: 14px; padding: 10px 22px 24px; background: #0a111d; border: 1px solid var(--border2); border-bottom: 0; border-radius: 16px 16px 0 0; scrollbar-width: thin; scrollbar-color: var(--border2) transparent; }
.sheet > * { flex-shrink: 0; }
.grab { width: 40px; height: 4px; margin: 0 auto 4px; border-radius: 4px; background: var(--border2); }
.sheet h3 { font-family: 'DM Serif Display', serif; font-weight: 400; font-size: 1.9rem; }
.sheet h3 em { font-style: italic; color: var(--accent2); }
.f { display: flex; flex-direction: column; gap: 6px; font-size: .7rem; color: var(--fg-dim); letter-spacing: .1em; text-transform: uppercase; }
.lab { display: flex; justify-content: space-between; gap: 10px; }
.cnt { letter-spacing: 0; font-variant-numeric: tabular-nums; }
.cnt.over { color: var(--red); }
.sheet input[type=text], .sheet textarea, .sheet select { width: 100%; padding: 10px 12px; border: 1px solid var(--border2); border-radius: 6px; background: rgba(0,0,0,.45);
  color: var(--fg); font: 400 16px/1.5 'Space Mono', monospace; letter-spacing: 0; text-transform: none; resize: vertical; }
.sheet input[type=text]:focus, .sheet textarea:focus, .sheet select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,.2); }
.sheet option { background: #0a111d; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--border2); border-radius: 6px; overflow: hidden; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: grid; place-items: center; min-height: 44px; font-size: .8rem; color: var(--fg-dim); cursor: pointer; }
.seg input:checked + span { background: rgba(59,130,246,.15); color: var(--fg); }
.seg input:focus-visible + span { outline: 2px solid var(--accent2); outline-offset: -2px; }
.optrow { display: flex; align-items: center; gap: 10px; }
.optrow input[type=radio] { flex: none; width: 22px; height: 22px; accent-color: var(--green); }
.err { min-height: 1.2em; font-size: .78rem; color: var(--red); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.own { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 12px; padding-top: 10px; border-top: 1px solid var(--border); font-size: .74rem; color: var(--fg-dim); }
.link { min-height: 44px; background: none; border: 0; color: var(--accent); font: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.export { min-height: 120px; font-size: 13px !important; }

#toast { position: fixed; left: 50%; bottom: 28px; z-index: 60; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; white-space: nowrap;
  padding: 10px 18px; border: 1px solid var(--border2); border-radius: 100px; background: rgba(10,17,29,.96); font-size: .76rem; transition: opacity .25s, transform .25s; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-height: 700px) { :root { --top: 108px; } .inner { gap: 14px; } .term-body { min-height: 100px; padding: 14px 16px; } .scroll-hint { display: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<header class="top">
  <div class="top-in">
    <div class="row1">
      <a class="back" href="https://smitchelld.github.io/" aria-label="Wróć na stronę główną SK.dev">← SK.dev</a>
      <div class="brand"><span class="brand-name">Stack<b>Prep</b></span><span class="brand-sub">fiszki przed rozmową</span></div>
      <span class="count" id="count">0 / 0</span>
      <button class="icon-btn" id="addBtn" type="button" aria-label="Dodaj pytanie">+</button>
    </div>
    <div class="bar"><i id="barFill"></i></div>
    <nav class="chips" id="chips" aria-label="Kategorie"></nav>
  </div>
</header>

<main id="feed" aria-live="polite"></main>

<div class="backdrop" id="backdrop" hidden></div>
<form class="sheet" id="sheet" hidden novalidate>
  <div class="grab"></div>
  <h3>Nowe <em>pytanie.</em></h3>
  <label class="f">Kategoria <select id="fKat"></select></label>
  <div class="seg" role="radiogroup" aria-label="Typ pytania">
    <label><input type="radio" name="typ" value="fiszka" checked><span>Fiszka</span></label>
    <label><input type="radio" name="typ" value="wybor"><span>Wybór</span></label>
  </div>
  <label class="f"><span class="lab">Pytanie <span class="cnt" data-for="fPyt"></span></span>
    <textarea id="fPyt" rows="2" maxlength="160"></textarea></label>
  <div id="polaFiszka">
    <label class="f"><span class="lab">Odpowiedź <span class="cnt" data-for="fOdp"></span></span>
      <textarea id="fOdp" rows="4" maxlength="220"></textarea></label>
  </div>
  <div id="polaWybor" class="f" hidden>
    <span class="lab">Odpowiedzi <span>kropka = poprawna</span></span>
    <div class="optrow"><input type="radio" name="pop" value="0" checked aria-label="A poprawna"><input type="text" class="fOpc" placeholder="A" maxlength="80"></div>
    <div class="optrow"><input type="radio" name="pop" value="1" aria-label="B poprawna"><input type="text" class="fOpc" placeholder="B" maxlength="80"></div>
    <div class="optrow"><input type="radio" name="pop" value="2" aria-label="C poprawna"><input type="text" class="fOpc" placeholder="C (opcjonalnie)" maxlength="80"></div>
    <div class="optrow"><input type="radio" name="pop" value="3" aria-label="D poprawna"><input type="text" class="fOpc" placeholder="D (opcjonalnie)" maxlength="80"></div>
    <label class="f"><span class="lab">Wyjaśnienie <span class="cnt" data-for="fWyj"></span></span>
      <textarea id="fWyj" rows="2" maxlength="220"></textarea></label>
  </div>
  <p class="err" id="fErr"></p>
  <div class="row">
    <button type="button" class="btn btn-outline" id="fAnuluj">Anuluj</button>
    <button type="submit" class="btn btn-fill">Dodaj</button>
  </div>
  <div class="own">
    <span id="fIle">Twoje pytania: 0</span>
    <button type="button" class="link" id="fKopiuj">Kopiuj jako JSONL</button>
  </div>
  <textarea id="fEksport" class="export" readonly hidden aria-label="Twoje pytania w formacie JSONL"></textarea>
</form>

<div id="toast" role="status"></div>

<!-- Zapas na wypadek otwarcia pliku bez serwera (file:// blokuje fetch). Normalnie strona czyta questions.jsonl. -->
<script type="text/plain" id="przyklad">
{"id": "python-001", "kategoria": "python", "typ": "fiszka", "pytanie": "Czym różni się lista od krotki?", "odpowiedz": "Lista jest mutowalna, krotka nie. Dlatego krotka (o hashowalnych elementach) może być kluczem w słowniku albo elementem zbioru."}
{"id": "python-002", "kategoria": "python", "typ": "wybor", "pytanie": "Co wypisze `print([1, 2, 3][-1])`?", "opcje": ["1", "3", "IndexError"], "poprawna": 1, "wyjasnienie": "Ujemny indeks liczy od końca: -1 to ostatni element, -2 przedostatni."}
{"id": "python-003", "kategoria": "python", "typ": "wybor", "pytanie": "Co zwraca funkcja, która nie ma `return`?", "opcje": ["0", "None", "Pusty string", "Rzuca wyjątek"], "poprawna": 1, "wyjasnienie": "Każda funkcja w Pythonie coś zwraca. Bez return jest to None."}
{"id": "python-101", "kategoria": "python", "typ": "fiszka", "pytanie": "Czym różnią się typy mutable i immutable? Podaj przykłady.", "odpowiedz": "Mutable zmieniasz w miejscu (`list`, `dict`, `set`). Immutable nie (`int`, `str`, `tuple`, `frozenset`) – „zmiana” tworzy nowy obiekt."}
{"id": "python-102", "kategoria": "python", "typ": "wybor", "pytanie": "Co zwróci `f(2)` po wcześniejszym `f(1)`, dla `def f(x, l=[]): l.append(x); return l`?", "opcje": ["`[1, 2]`", "`[2]`", "`[1]`", "`TypeError`"], "poprawna": 0, "wyjasnienie": "Domyślna lista tworzy się raz, przy definicji funkcji, i jest współdzielona. Bezpieczny wzorzec: `l=None` i `if l is None: l = []`."}
{"id": "python-103", "kategoria": "python", "typ": "wybor", "pytanie": "Czym jest `**kwargs` w definicji funkcji?", "opcje": ["krotką dodatkowych argumentów pozycyjnych", "słownikiem nazwanych argumentów, które nie pasują do parametrów", "potęgowaniem argumentów", "listą wszystkich argumentów funkcji"], "poprawna": 1, "wyjasnienie": "`*args` zbiera nadmiarowe argumenty pozycyjne w krotkę, a `**kwargs` nadmiarowe nazwane w słownik."}
{"id": "python-104", "kategoria": "python", "typ": "wybor", "pytanie": "Czym różni się `is` od `==`?", "opcje": ["`is` porównuje wartości, `==` tożsamość", "`is` działa tylko dla `None`", "`is` sprawdza tożsamość obiektu, `==` porównuje wartości", "nie ma różnicy, to aliasy"], "poprawna": 2, "wyjasnienie": "`[1] == [1]` to `True`, ale `[1] is [1]` to `False` (dwa osobne obiekty). `is` używamy głównie z `None`."}
{"id": "python-105", "kategoria": "python", "typ": "fiszka", "pytanie": "Jakie wartości w Pythonie są „falsy”?", "odpowiedz": "`False`, `None`, `0`, `0.0`, puste `str`, `list`, `tuple`, `dict`, `set`. Własne obiekty: gdy `__bool__` daje `False` lub `__len__` daje 0."}

{"id": "python-107", "kategoria": "python", "typ": "fiszka", "pytanie": "Co to jest zasada LEGB?", "odpowiedz": "Kolejność szukania nazw zmiennych: Local, Enclosing (funkcje zewnętrzne), Global (moduł), Built-in (wbudowane, np. `len`)."}

{"id": "python-225", "kategoria": "python", "typ": "wybor", "pytanie": "Co się stanie przy `B()`, gdy `B` dziedziczy po `ABC` i ma nieimplementowaną `@abstractmethod`?", "opcje": ["`NotImplementedError` przy wywołaniu metody", "Nic, błąd dopiero przy pierwszym użyciu", "`SyntaxError` przy definicji klasy", "`TypeError` przy tworzeniu instancji"], "poprawna": 3, "wyjasnienie": "Instancji klasy z niezaimplementowanymi metodami abstrakcyjnymi nie utworzysz: `TypeError: Can't instantiate abstract class`."}
{"id": "python-226", "kategoria": "python", "typ": "fiszka", "pytanie": "Co to jest duck typing w Pythonie?", "odpowiedz": "Liczy się to, co obiekt potrafi, nie jego typ: jeśli ma potrzebną metodę, działa. Przykład: `len(x)` działa dla każdego obiektu z `__len__`."}
{"id": "python-227", "kategoria": "python", "typ": "fiszka", "pytanie": "Co robi `raise NewError(...) from e` i po co?", "odpowiedz": "Ustawia `__cause__`, więc traceback pokazuje, że nowy wyjątek wynika z `e`. Zachowujesz oryginalną przyczynę, np. `KeyError` zamieniony na własny błąd."}
{"id": "python-228", "kategoria": "python", "typ": "fiszka", "pytanie": "Jak połączone są `__eq__` i `__hash__` i czemu klucz `dict` nie powinien się zmieniać?", "odpowiedz": "Równe obiekty muszą mieć równy hash. Zmiana pól wpływających na hash po wstawieniu do `set`/`dict` powoduje, że obiekt nie zostanie znaleziony."}
{"id": "python-229", "kategoria": "python", "typ": "wybor", "pytanie": "Co zwróci `sorted([('b',1), ('a',1), ('c',0)], key=lambda t: t[1])`?", "opcje": ["`[('c', 0), ('a', 1), ('b', 1)]`", "`[('c', 0), ('b', 1), ('a', 1)]`", "`[('a', 1), ('b', 1), ('c', 0)]`", "`[('b', 1), ('a', 1), ('c', 0)]`"], "poprawna": 1, "wyjasnienie": "Sortowanie jest stabilne: elementy o równym kluczu zachowują kolejność wejściową, więc `('b', 1)` zostaje przed `('a', 1)`."}
{"id": "python-230", "kategoria": "python", "typ": "fiszka", "pytanie": "Do czego służy `unittest.mock.patch` w testach?", "odpowiedz": "Na czas testu podmienia obiekt (np. `requests.get`, połączenie z bazą) na atrapę `Mock`. Test jest szybki, deterministyczny i nie dotyka zewnętrznych usług."}
{"id": "python-231", "kategoria": "python", "typ": "fiszka", "pytanie": "Co daje `@pytest.mark.parametrize` i jak go użyć?", "odpowiedz": "Uruchamia ten sam test dla wielu zestawów danych: `@pytest.mark.parametrize('a,b,exp', [(1,2,3), (0,0,0)])`. Każdy zestaw to osobny przypadek w raporcie."}
{"id": "python-232", "kategoria": "python", "typ": "fiszka", "pytanie": "Czym są fixtures w `pytest`?", "odpowiedz": "Funkcje z `@pytest.fixture` przygotowujące dane lub zasoby (np. klient bazy). Test dostaje je przez nazwę argumentu, a `yield` pozwala posprzątać po teście."}
{"id": "python-233", "kategoria": "python", "typ": "fiszka", "pytanie": "Do czego służy plik `__init__.py` i czym jest pakiet?", "odpowiedz": "Pakiet to katalog z modułami importowanymi po nazwie. `__init__.py` oznacza go jako pakiet i wykonuje się przy imporcie, np. do eksportu nazw."}
{"id": "python-234", "kategoria": "python", "typ": "fiszka", "pytanie": "Czym różni się import względny (`from .utils import x`) od bezwzględnego?", "odpowiedz": "Względny liczy od bieżącego pakietu (`.`, `..`), bezwzględny podaje pełną ścieżkę (`from app.utils import x`). PEP 8 zaleca bezwzględne."}
{"id": "python-235", "kategoria": "python", "typ": "fiszka", "pytanie": "Czym jest `pyproject.toml` i czym `poetry`/`uv` różnią się od samego `pip`?", "odpowiedz": "To standardowy plik konfiguracji projektu: metadane, zależności, narzędzia. `poetry`/`uv` dodatkowo zarządzają środowiskiem i lockfile; `pip` tylko instaluje."}
{"id": "python-236", "kategoria": "python", "typ": "wybor", "pytanie": "Co oznacza adnotacja `Optional[int]`?", "opcje": ["`int` albo `None`, równoważne `int | None`", "Opcjonalny argument z wartością domyślną", "Typ `int` lub `float`", "Liczba, która może być pominięta w wywołaniu"], "poprawna": 0, "wyjasnienie": "`Optional[X]` to `Union[X, None]`. Nie czyni argumentu opcjonalnym; wartość domyślną trzeba podać osobno."}
{"id": "python-237", "kategoria": "python", "typ": "fiszka", "pytanie": "Dlaczego sprawdzamy `x is None` zamiast `x == None`?", "odpowiedz": "`None` jest singletonem, więc `is` sprawdza tożsamość i jest szybkie. `==` można nadpisać w `__eq__`, a `if not x` pomyliłoby `None` z `0` czy `[]`."}
{"id": "python-238", "kategoria": "python", "typ": "wybor", "pytanie": "Co wypisze `print(-7 // 2, -7 % 2)`?", "opcje": ["`-3 -1`", "`-4 1`", "`-3 1`", "`-4 -1`"], "poprawna": 1, "wyjasnienie": "`//` zaokrągla w dół (do −∞), a wynik `%` ma znak dzielnika. Zachodzi `a == (a // b) * b + a % b`: −8 + 1 = −7."}
{"id": "python-239", "kategoria": "python", "typ": "wybor", "pytanie": "Co zwróci `(round(2.5), round(3.5))`?", "opcje": ["`(3, 4)`", "`(2, 3)`", "`(2, 4)`", "`(3, 3)`"], "poprawna": 2, "wyjasnienie": "Python 3 zaokrągla połówki do parzystej (banker's rounding): 2.5 → 2, 3.5 → 4."}
{"id": "python-240", "kategoria": "python", "typ": "wybor", "pytanie": "Co wypisze `0.1 + 0.2 == 0.3` i jak to poprawnie porównać?", "opcje": ["`True`; float jest dokładny", "`False`; użyj `is`", "`True`; ale `0.1 + 0.2` daje `0.3`", "`False`; użyj `math.isclose`"], "poprawna": 3, "wyjasnienie": "Float jest binarny: `0.1 + 0.2` to `0.30000000000000004`. Porównuj z tolerancją (`math.isclose`) lub użyj `Decimal`."}
{"id": "python-241", "kategoria": "python", "typ": "wybor", "pytanie": "Co wypisze `d = {'l': [1]}; c = d.copy(); c['l'].append(2); print(d)`?", "opcje": ["`{'l': [1]}`", "`{'l': [1, 2]}`", "`{'l': [2]}`", "`KeyError`"], "poprawna": 1, "wyjasnienie": "`d.copy()` i `dict(d)` robią płytką kopię: wewnętrzna lista jest wspólna. Do niezależnej kopii użyj `copy.deepcopy`."}
{"id": "python-242", "kategoria": "python", "typ": "wybor", "pytanie": "Co się stanie po `x = 1`, `def f(): x += 1`, `f()`?", "opcje": ["Funkcja zwiększy globalne `x` do 2", "`NameError` na poziomie modułu", "Powstanie nowe lokalne `x == 2`", "`UnboundLocalError`"], "poprawna": 3, "wyjasnienie": "Przypisanie w funkcji robi `x` zmienną lokalną, więc odczyt przed przypisaniem nie działa. Potrzeba `global x` (lepiej unikać)."}
{"id": "python-243", "kategoria": "python", "typ": "wybor", "pytanie": "Co zwróci `a2.items` po `class A: items = []`, `a1, a2 = A(), A()` i `a1.items.append(1)`?", "opcje": ["`[1]`, lista jest wspólna dla klasy", "`[]`, każda instancja ma własną", "`AttributeError`", "`None`"], "poprawna": 0, "wyjasnienie": "Mutowalny atrybut klasy jest współdzielony. Własną listę utwórz w `__init__`: `self.items = []`."}
{"id": "python-244", "kategoria": "python", "typ": "fiszka", "pytanie": "Kiedy użyć `@staticmethod` zamiast zwykłej metody?", "odpowiedz": "Gdy funkcja logicznie należy do klasy, ale nie potrzebuje `self` ani `cls`, np. walidator formatu. To organizacja kodu, nie zmiana działania."}
{"id": "python-245", "kategoria": "python", "typ": "fiszka", "pytanie": "Co się stanie, gdy podklasa nadpisze `__init__` i nie wywoła `super().__init__()`?", "odpowiedz": "Inicjalizacja rodzica się nie wykona, więc jego atrybuty nie powstaną i dostęp do nich da `AttributeError`."}
{"id": "web-101", "kategoria": "web", "typ": "fiszka", "pytanie": "Jak w REST projektuje się adresy zasobów? Podaj dobry i zły przykład.", "odpowiedz": "Zasoby to rzeczowniki, zwykle w liczbie mnogiej: `GET /users/42/orders`. Źle: `/getUserOrders` – czynność wyraża metoda HTTP, nie URL."}
{"id": "web-102", "kategoria": "web", "typ": "wybor", "pytanie": "Która metoda HTTP NIE jest idempotentna?", "opcje": ["`PUT`", "`DELETE`", "`POST`", "`GET`"], "poprawna": 2, "wyjasnienie": "`POST` zwykle tworzy zasób, więc powtórzenie żądania tworzy kolejny. `PUT`, `DELETE` i `GET` dają ten sam stan po wielu powtórzeniach."}
{"id": "web-103", "kategoria": "web", "typ": "fiszka", "pytanie": "Co znaczy, że metoda HTTP jest idempotentna? Podaj przykład.", "odpowiedz": "Wielokrotne wykonanie tego samego żądania daje ten sam stan serwera co jedno. Np. `PUT /users/1` czy `DELETE /users/1`. Ważne przy ponawianiu po błędzie sieci."}
{"id": "web-104", "kategoria": "web", "typ": "wybor", "pytanie": "Czym ASGI różni się od WSGI?", "opcje": ["ASGI obsługuje async i WebSockety, WSGI jest synchroniczne", "ASGI to framework, WSGI to serwer", "WSGI działa tylko z Django", "ASGI służy tylko do plików statycznych"], "poprawna": 0, "wyjasnienie": "WSGI to synchroniczny standard serwer–aplikacja (Flask, Django). ASGI to jego asynchroniczny następca, obsługuje też WebSockety (FastAPI)."}
{"id": "web-105", "kategoria": "web", "typ": "fiszka", "pytanie": "Flask, Django, FastAPI – do czego który nadaje się najlepiej?", "odpowiedz": "Flask: lekki mikroframework, pełna swoboda. Django: „baterie w zestawie” (ORM, admin, auth), pełne aplikacje. FastAPI: szybkie API, async, walidacja typami."}
{"id": "web-106", "kategoria": "web", "typ": "fiszka", "pytanie": "Czym jest middleware i gdzie leży w cyklu żądanie–odpowiedź?", "odpowiedz": "Warstwa między serwerem a widokiem: przetwarza żądanie przed handlerem i odpowiedź po nim. Typowo: logowanie, sesje, CORS, autoryzacja."}
{"id": "web-107", "kategoria": "web", "typ": "fiszka", "pytanie": "Co to jest routing w frameworku webowym?", "odpowiedz": "Dopasowanie metody i ścieżki URL do funkcji obsługującej (widoku/handlera), np. `@app.get(\"/users/{id}\")` kieruje żądanie do konkretnej funkcji."}
{"id": "web-108", "kategoria": "web", "typ": "fiszka", "pytanie": "Czym jest ORM i jaki daje zysk oraz koszt?", "odpowiedz": "Mapuje tabele na klasy Pythona, więc zapytania piszesz obiektowo (np. SQLAlchemy, Django ORM). Zysk: mniej SQL i boilerplate. Koszt: ryzyko nieefektywnych zapytań."}
{"id": "web-109", "kategoria": "web", "typ": "wybor", "pytanie": "Jak najczęściej naprawia się problem N+1 zapytań w ORM?", "opcje": ["Dodając więcej indeksów w bazie", "Pobierając powiązane obiekty z góry (JOIN / eager loading)", "Zwiększając limit połączeń", "Wyłączając ORM w produkcji"], "poprawna": 1, "wyjasnienie": "N+1: 1 zapytanie o listę i N o powiązane rekordy. Eager loading (np. `select_related`, `joinedload`) pobiera je jednym zapytaniem."}
{"id": "web-110", "kategoria": "web", "typ": "fiszka", "pytanie": "Do czego służą migracje bazy danych?", "odpowiedz": "To wersjonowane skrypty zmian schematu (tabele, kolumny), trzymane w repozytorium. Pozwalają spójnie aktualizować bazę na każdym środowisku (np. Alembic, Django)."}
{"id": "web-111", "kategoria": "web", "typ": "fiszka", "pytanie": "Sesje po stronie serwera a tokeny JWT – główna różnica?", "odpowiedz": "Sesja: stan trzymany na serwerze, klient ma tylko id (w cookie). JWT: podpisany token ze stanem u klienta, serwer niczego nie zapisuje, ale trudniej go unieważnić."}
{"id": "web-112", "kategoria": "web", "typ": "wybor", "pytanie": "Co daje flaga `HttpOnly` na ciasteczku?", "opcje": ["JavaScript nie może go odczytać", "Wysyłane jest tylko przez HTTPS", "Nie jest wysyłane do innych domen", "Wygasa po zamknięciu karty"], "poprawna": 0, "wyjasnienie": "`HttpOnly` blokuje dostęp z `document.cookie`, co utrudnia kradzież sesji przez XSS. Za HTTPS odpowiada `Secure`, za domeny `SameSite`."}
{"id": "web-113", "kategoria": "web", "typ": "fiszka", "pytanie": "Uwierzytelnianie a autoryzacja – różnica?", "odpowiedz": "Uwierzytelnianie (authentication): kim jesteś (login, hasło). Autoryzacja (authorization): co ci wolno (role, uprawnienia). Pierwsze jest przed drugim."}
{"id": "web-114", "kategoria": "web", "typ": "wybor", "pytanie": "Jak poprawnie przechowywać hasła użytkowników?", "opcje": ["Zaszyfrować kluczem AES z konfiguracji", "Zahaszować MD5 z solą", "Zapisać jawnie, ale chronić bazę", "Zahaszować wolnym algorytmem (bcrypt/argon2)"], "poprawna": 3, "wyjasnienie": "Hasła hashuje się wolnym, solonym algorytmem: bcrypt lub argon2. MD5 jest zbyt szybki i łamliwy, a szyfrowanie jest odwracalne."}
{"id": "web-115", "kategoria": "web", "typ": "fiszka", "pytanie": "Czym jest CORS i kto go egzekwuje?", "odpowiedz": "Mechanizm, w którym serwer nagłówkami (`Access-Control-Allow-Origin`) zezwala stronie z innej domeny na wywołania API. Egzekwuje go przeglądarka, nie serwer."}
{"id": "web-116", "kategoria": "web", "typ": "fiszka", "pytanie": "Na czym polega atak CSRF i jak się przed nim bronić?", "odpowiedz": "Zły serwis nakłania przeglądarkę zalogowanej ofiary do wysłania żądania do Twojej aplikacji z jej ciasteczkiem. Obrona: token CSRF, ciasteczka `SameSite`."}
{"id": "web-117", "kategoria": "web", "typ": "wybor", "pytanie": "Co najlepiej chroni przed XSS w szablonach HTML?", "opcje": ["Walidacja hasła po stronie klienta", "Ukrycie pliku `.env`", "Automatyczne escapowanie danych użytkownika", "Użycie metody `POST` zamiast `GET`"], "poprawna": 2, "wyjasnienie": "Silniki szablonów (Jinja2, Django) domyślnie escapują `<`, `>` itd. Nie wyłączaj tego (`|safe`) dla danych od użytkownika."}
{"id": "web-118", "kategoria": "web", "typ": "wybor", "pytanie": "Jak skutecznie chronić się przed SQL injection?", "opcje": ["Zapytania parametryzowane (placeholdery)", "Usuwanie apostrofów z danych regexem", "Sklejanie zapytań przez f-string", "Ukrycie nazw tabel"], "poprawna": 0, "wyjasnienie": "Parametry przekazuje się osobno od SQL (`cursor.execute(sql, (x,))`), więc baza nigdy nie traktuje ich jak kodu. ORM robi to domyślnie."}
{"id": "web-119", "kategoria": "web", "typ": "fiszka", "pytanie": "Jak trzymać sekrety (hasła do bazy, klucze API) w aplikacji?", "odpowiedz": "W zmiennych środowiskowych, lokalnie np. z pliku `.env` dodanego do `.gitignore`. Nigdy w kodzie ani w repozytorium. Sekret, który trafił do gita, uznaj za ujawniony i wymień."}
{"id": "web-120", "kategoria": "web", "typ": "fiszka", "pytanie": "Dlaczego API zwracające listy powinno mieć paginację? Jakie są warianty?", "odpowiedz": "Żeby nie zwracać tysięcy rekordów naraz. Warianty: `limit`/`offset` (prosty) i kursor (stabilny przy zmianach danych, wydajny na dużych zbiorach)."}
{"id": "web-121", "kategoria": "web", "typ": "wybor", "pytanie": "Do czego służy cache (np. Redis) przed bazą danych?", "opcje": ["Do szyfrowania danych", "Do trwałego backupu bazy", "Do szybszego zwracania często czytanych wyników", "Do uwierzytelniania użytkowników"], "poprawna": 2, "wyjasnienie": "Cache trzyma wyniki kosztownych zapytań w szybkiej pamięci. Trzeba pamiętać o unieważnianiu (TTL), by nie serwować nieaktualnych danych."}
{"id": "web-122", "kategoria": "web", "typ": "fiszka", "pytanie": "Po co kolejka zadań w tle (np. Celery) w aplikacji webowej?", "odpowiedz": "Żeby wolne zadania (wysyłka maili, raporty) wykonywał osobny worker, a żądanie HTTP odpowiadało od razu. Kolejkę zwykle zapewnia broker (Redis, RabbitMQ)."}
{"id": "web-123", "kategoria": "web", "typ": "wybor", "pytanie": "Co robi Pydantic w API (np. FastAPI)?", "opcje": ["Szyfruje ruch HTTP", "Waliduje i parsuje dane według typów", "Zarządza migracjami bazy", "Uruchamia zadania w tle"], "poprawna": 1, "wyjasnienie": "Modele Pydantic opisują strukturę danych; błędne wejście daje czytelny błąd (w FastAPI kod `422`), a poprawne jest konwertowane na typy."}
{"id": "web-124", "kategoria": "web", "typ": "fiszka", "pytanie": "Jak testuje się endpointy API bez uruchamiania prawdziwego serwera?", "odpowiedz": "Klientem testowym frameworka (`app.test_client()` we Flasku, `TestClient` w FastAPI), który wysyła żądania do aplikacji w pamięci. Sprawdzasz status i JSON."}
{"id": "web-125", "kategoria": "web", "typ": "wybor", "pytanie": "Czego NIE powinno się zapisywać w logach aplikacji?", "opcje": ["Identyfikatora żądania", "Haseł, tokenów i danych osobowych", "Czasu odpowiedzi", "Poziomu błędu"], "poprawna": 1, "wyjasnienie": "Logi bywają szeroko dostępne i długo przechowywane. Hasła i tokeny w logach to wyciek; loguj zdarzenia, id żądania i błędy."}
{"id": "web-126", "kategoria": "web", "typ": "fiszka", "pytanie": "Po co stawia się nginx przed gunicornem/uvicornem?", "odpowiedz": "Nginx jako reverse proxy obsługuje TLS, pliki statyczne, wolnych klientów i równoważenie obciążenia. Gunicorn/uvicorn uruchamia kod aplikacji."}
{"id": "web-201", "kategoria": "web", "typ": "fiszka", "pytanie": "Co oznacza wzorzec MTV w Django i czym jest tu „view”?", "odpowiedz": "Model (dane i ORM), Template (prezentacja), View (logika: dostaje request, zwraca response). „View” Django odpowiada kontrolerowi z MVC."}
{"id": "web-202", "kategoria": "web", "typ": "fiszka", "pytanie": "Kiedy wykonuje się zapytanie SQL w Django QuerySet? Co to „leniwość”?", "odpowiedz": "QuerySet jest leniwy: `filter()`/`exclude()` tylko budują zapytanie. SQL idzie dopiero przy ewaluacji (iteracja, `list()`, `len()`, `bool()`), potem wynik się cache'uje."}
{"id": "web-203", "kategoria": "web", "typ": "wybor", "pytanie": "Co zrobi `Model.objects.get(pk=999)`, jeśli taki rekord nie istnieje?", "opcje": ["Zwróci `None`", "Rzuci wyjątek `Model.DoesNotExist`", "Zwróci pusty `QuerySet`", "Zwróci `False`"], "poprawna": 1, "wyjasnienie": "`get()` oczekuje dokładnie jednego rekordu: przy braku rzuca `DoesNotExist`, przy wielu `MultipleObjectsReturned`. `filter()` zwraca QuerySet."}
{"id": "web-204", "kategoria": "web", "typ": "wybor", "pytanie": "Co robi `python manage.py makemigrations` w odróżnieniu od `migrate`?", "opcje": ["`makemigrations` zmienia bazę, `migrate` tworzy pliki", "Oba robią to samo, różnią się tylko nazwą", "`makemigrations` tworzy pliki migracji; `migrate` stosuje je na bazie", "`makemigrations` usuwa stare tabele, `migrate` je tworzy"], "poprawna": 2, "wyjasnienie": "`makemigrations` porównuje modele ze stanem migracji i generuje pliki (do repo). `migrate` wykonuje je na bazie danych."}
{"id": "web-205", "kategoria": "web", "typ": "fiszka", "pytanie": "Czym jest panel admina Django i do kogo jest przeznaczony?", "odpowiedz": "Automatycznie generowany interfejs CRUD dla modeli (`admin.site.register` lub `@admin.register`). Jest dla zespołu wewnętrznego, nie dla użytkowników końcowych."}
{"id": "web-206", "kategoria": "web", "typ": "fiszka", "pytanie": "Co zmienia `DEBUG = False` na produkcji w Django i dlaczego `True` jest groźne?", "odpowiedz": "Przy `True` strona błędu pokazuje kod, ustawienia i zmienne, więc wycieka wiedza o systemie. `False` daje ogólne 500/404 i wymaga `ALLOWED_HOSTS`."}
{"id": "web-207", "kategoria": "web", "typ": "wybor", "pytanie": "Do czego służy `ALLOWED_HOSTS` w Django?", "opcje": ["Do listy adresów IP, które mogą wejść do panelu admina", "Do wskazania hostów bazy danych", "Do konfiguracji domen dla CORS", "Do walidacji nagłówka `Host` (ochrona przed Host header attack)"], "poprawna": 3, "wyjasnienie": "Przy `DEBUG=False` i pustej liście Django odpowiada 400 na każde żądanie. Trzeba wpisać domeny serwisu."}
{"id": "web-208", "kategoria": "web", "typ": "fiszka", "pytanie": "Do czego służą sygnały (signals) w Django i jaka jest ich wada?", "odpowiedz": "Pozwalają reagować na zdarzenia, np. `post_save`, bez wiązania kodu ze sobą (np. utwórz profil po rejestracji). Wada: niejawny przepływ, trudniejszy do debugowania."}
{"id": "web-209", "kategoria": "web", "typ": "fiszka", "pytanie": "Do czego służą serializery w Django REST Framework?", "odpowiedz": "Zamieniają obiekty modeli na JSON i odwrotnie oraz walidują dane wejściowe. `ModelSerializer` generuje pola na podstawie modelu."}
{"id": "web-210", "kategoria": "web", "typ": "fiszka", "pytanie": "Jak działa `Depends` w FastAPI i po co się go używa?", "odpowiedz": "Parametr `x = Depends(fn)`: FastAPI woła `fn` przy każdym żądaniu i wstrzykuje wynik (sesja DB, bieżący użytkownik). W testach można podmienić przez `dependency_overrides`."}
{"id": "web-211", "kategoria": "web", "typ": "wybor", "pytanie": "Endpoint FastAPI jest `async def` i woła blokujące `time.sleep(5)`. Co się stanie?", "opcje": ["Zablokuje pętlę zdarzeń, więc inne żądania poczekają", "Nic, FastAPI sam przeniesie go do osobnego wątku", "Rzuci wyjątek, bo `sleep` jest niedozwolony", "Tylko to jedno żądanie będzie wolne"], "poprawna": 0, "wyjasnienie": "`def` FastAPI uruchamia w puli wątków, ale `async def` działa w pętli zdarzeń. Blokada w nim wstrzymuje cały proces. Użyj `await asyncio.sleep`."}
{"id": "web-212", "kategoria": "web", "typ": "fiszka", "pytanie": "Skąd FastAPI ma dokumentację pod `/docs` i czym jest OpenAPI?", "odpowiedz": "Generuje ją automatycznie z podpowiedzi typów i modeli Pydantic. OpenAPI to standardowy opis API (`/openapi.json`), a Swagger UI to narzędzie, które go wyświetla."}
{"id": "web-213", "kategoria": "web", "typ": "wybor", "pytanie": "Co daje parametr `response_model` w dekoratorze endpointu FastAPI?", "opcje": ["Zmienia metodę HTTP endpointu", "Filtruje i waliduje odpowiedź wg schematu, np. ukrywa `password_hash`", "Włącza cache odpowiedzi", "Wybiera szablon HTML do renderowania"], "poprawna": 1, "wyjasnienie": "Zwrócony obiekt jest przycinany do pól ze schematu, a schemat trafia do dokumentacji OpenAPI."}
{"id": "web-214", "kategoria": "web", "typ": "fiszka", "pytanie": "Czym są blueprinty we Flasku?", "odpowiedz": "Sposobem modularnego grupowania tras i widoków (np. `auth`, `api`). Rejestruje się je przez `app.register_blueprint(bp, url_prefix='/api')`."}
{"id": "web-215", "kategoria": "web", "typ": "wybor", "pytanie": "Co się stanie po użyciu obiektu `request` Flaska poza obsługą żądania?", "opcje": ["Zwróci pusty słownik", "Zwróci ostatnie żądanie z cache", "`RuntimeError`: praca poza kontekstem aplikacji/żądania", "Zwróci `None`"], "poprawna": 2, "wyjasnienie": "`request` żyje w kontekście żądania. `g` to magazyn na dane w obrębie jednego kontekstu aplikacji (zwykle jednego żądania)."}
{"id": "web-216", "kategoria": "web", "typ": "fiszka", "pytanie": "Jak wersjonować API REST i kiedy wprowadzić nową wersję?", "odpowiedz": "Najczęściej w ścieżce: `/api/v1/users`, rzadziej nagłówkiem. Nowa wersja przy zmianach łamiących zgodność; starą utrzymuje się przez okres przejściowy."}
{"id": "web-217", "kategoria": "web", "typ": "wybor", "pytanie": "Jaki format błędów API jest najlepszą praktyką?", "opcje": ["Raz tekst, raz HTML, zależnie od błędu", "Zawsze 200 i opis błędu w treści", "Sam stack trace w odpowiedzi", "Zawsze ta sama struktura JSON, np. `code`, `message`, `details`"], "poprawna": 3, "wyjasnienie": "Spójny format (np. RFC 9457 `application/problem+json`) ułatwia klientom obsługę. Stack trace nie może wyciekać."}
{"id": "web-218", "kategoria": "web", "typ": "fiszka", "pytanie": "Jak w REST przekazywać filtrowanie, sortowanie i paginację listy?", "odpowiedz": "Przez parametry zapytania: `GET /orders?status=paid&sort=-created_at&page=2`. Ścieżka identyfikuje zasób, a query go zawęża."}
{"id": "web-219", "kategoria": "web", "typ": "fiszka", "pytanie": "Czym jest HATEOAS w jednym zdaniu?", "odpowiedz": "Odpowiedź zawiera linki do powiązanych zasobów i dozwolonych akcji, więc klient nawiguje po API jak po stronie WWW. W praktyce rzadko w pełni stosowane."}
{"id": "web-220", "kategoria": "web", "typ": "wybor", "pytanie": "Czym OpenID Connect różni się od OAuth 2.0?", "opcje": ["OIDC dodaje uwierzytelnianie: ID token (JWT) z tożsamością użytkownika", "OIDC to nowsza wersja OAuth 2.0 bez access tokenów", "OAuth 2.0 służy do logowania, a OIDC do autoryzacji", "OIDC działa tylko z hasłami, bez zewnętrznych dostawców"], "poprawna": 0, "wyjasnienie": "OAuth 2.0 to delegowana autoryzacja (dostęp do zasobów). OIDC to warstwa nad nim, która mówi, kim jest użytkownik (logowanie przez Google)."}
{"id": "web-221", "kategoria": "web", "typ": "fiszka", "pytanie": "Czym różni się access token od refresh tokena?", "odpowiedz": "Access token jest krótkożyjący (minuty) i wysyłany z każdym żądaniem. Refresh token jest długożyjący, trafia tylko do serwera autoryzacji po nowy access token i można go unieważnić."}
{"id": "web-222", "kategoria": "web", "typ": "fiszka", "pytanie": "Gdzie w przeglądarce przechowywać tokeny i jakie są kompromisy?", "odpowiedz": "`localStorage`: prosto, ale XSS kradnie token. Ciasteczko `HttpOnly`+`Secure`+`SameSite`: JS go nie czyta, lecz trzeba chronić przed CSRF. Pamięć: znika po odświeżeniu."}
{"id": "web-223", "kategoria": "web", "typ": "wybor", "pytanie": "Klient przekroczył limit zapytań (rate limit). Co powinno zwrócić API?", "opcje": ["`403 Forbidden` bez dodatkowych nagłówków", "`429 Too Many Requests`, najlepiej z nagłówkiem `Retry-After`", "`500 Internal Server Error`", "`200 OK` z pustą listą"], "poprawna": 1, "wyjasnienie": "429 to kod dedykowany limitom. `Retry-After` mówi, ile czekać. Limity liczy się per IP, użytkownik lub klucz API."}
{"id": "web-224", "kategoria": "web", "typ": "fiszka", "pytanie": "WebSockets, SSE, polling – czym się różnią i kiedy co wybrać?", "odpowiedz": "Polling: cykliczne zapytania, proste, ale marnotrawne. SSE: jednokierunkowy strumień serwer->klient po HTTP. WebSocket: stałe połączenie dwukierunkowe (czat, gry)."}
{"id": "web-225", "kategoria": "web", "typ": "fiszka", "pytanie": "Po co uruchamia się wiele workerów gunicorna?", "odpowiedz": "Worker to osobny proces obsługujący (w trybie sync) jedno żądanie naraz. Wiele workerów daje równoległość na wielu rdzeniach, omija GIL i odporność na awarię jednego."}
{"id": "web-226", "kategoria": "web", "typ": "wybor", "pytanie": "Czym jest webhook?", "opcje": ["Zapytaniem Twojego serwera do API co kilka sekund", "Stałym połączeniem WebSocket z klientem", "Wywołaniem Twojego URL-a przez inną usługę, gdy zajdzie zdarzenie", "Hookiem Gita uruchamianym przy commicie"], "poprawna": 2, "wyjasnienie": "To odwrotność pollingu. Weryfikuj podpis (HMAC), odpowiadaj szybko kodem 2xx i obsługuj powtórki idempotentnie."}
{"id": "web-227", "kategoria": "web", "typ": "fiszka", "pytanie": "GraphQL a REST – główna różnica, zaleta i koszt GraphQL?", "odpowiedz": "GraphQL ma zwykle jeden endpoint, a klient w zapytaniu wybiera pola (mniej over/under-fetchingu). Koszty: trudniejszy cache HTTP, ryzyko N+1 i złożonych zapytań."}
{"id": "web-228", "kategoria": "web", "typ": "wybor", "pytanie": "Jak bezpiecznie obsłużyć upload pliku od użytkownika?", "opcje": ["Zaufać nazwie pliku i nagłówkowi `Content-Type`", "Zapisać plik pod oryginalną nazwą w katalogu aplikacji", "Sprawdzić tylko rozszerzenie w JavaScripcie", "Limit rozmiaru, własna nazwa pliku, walidacja typu po zawartości"], "poprawna": 3, "wyjasnienie": "Nazwa i MIME pochodzą od klienta, więc można je podrobić (np. `../../x`). Generuj nazwę, sprawdzaj magic bytes, trzymaj poza kodem lub w object storage."}
{"id": "web-229", "kategoria": "web", "typ": "fiszka", "pytanie": "Czy SPA z tokenem w nagłówku `Authorization` potrzebuje ochrony CSRF?", "odpowiedz": "Zwykle nie: przeglądarka nie dokleja nagłówka automatycznie, jak ciasteczka. Gdy uwierzytelnianie opiera się na ciasteczku, ochrona CSRF jest nadal potrzebna."}
{"id": "web-230", "kategoria": "web", "typ": "wybor", "pytanie": "Co robi nagłówek `Content-Security-Policy` (CSP)?", "opcje": ["Ogranicza źródła skryptów i zasobów, łagodząc skutki XSS", "Wymusza HTTPS na czas z `max-age`", "Blokuje zgadywanie typu MIME przez przeglądarkę", "Włącza CORS dla wszystkich domen"], "poprawna": 0, "wyjasnienie": "HTTPS wymusza HSTS, a `X-Content-Type-Options: nosniff` blokuje zgadywanie MIME. CSP to osobna warstwa obrony przed XSS."}
{"id": "web-231", "kategoria": "web", "typ": "fiszka", "pytanie": "Jak serwować pliki statyczne w produkcji Django?", "odpowiedz": "`collectstatic` zbiera je w jednym katalogu, a serwuje nginx, CDN lub WhiteNoise. `runserver` i sam gunicorn nie nadają się do tego wydajnie."}
{"id": "web-232", "kategoria": "web", "typ": "wybor", "pytanie": "Po co stosuje się pulę połączeń do bazy (np. PgBouncer)?", "opcje": ["Szyfruje ruch między aplikacją a bazą", "Reużycie połączeń obniża koszt ich otwierania i limituje ich liczbę", "Dzieli zapytania na kilka baz", "Zastępuje indeksy przyspieszeniem zapytań"], "poprawna": 1, "wyjasnienie": "Nowe połączenie jest kosztowne, a Postgres ma limit `max_connections`. Wiele workerów bez puli szybko go wyczerpie."}
{"id": "web-233", "kategoria": "web", "typ": "fiszka", "pytanie": "Czym jest klucz idempotentności (`Idempotency-Key`) przy płatnościach?", "odpowiedz": "Klient wysyła unikalny klucz z żądaniem. Serwer zapamiętuje wynik pierwszego wykonania i przy powtórce (timeout, retry) zwraca go bez ponownego obciążenia karty."}
{"id": "web-234", "kategoria": "web", "typ": "fiszka", "pytanie": "Po co endpoint health check i czym różni się liveness od readiness?", "odpowiedz": "Np. `/health` zwraca 200, gdy aplikacja działa. Liveness: proces żyje (inaczej restart). Readiness: gotowa na ruch (np. baza dostępna). Używa go load balancer lub Kubernetes."}
{"id": "web-235", "kategoria": "web", "typ": "wybor", "pytanie": "Jak przesyłać daty i czas w API?", "opcje": ["Jako tekst w lokalnej strefie serwera, np. `23.11.26 14:30`", "Jako czas lokalny użytkownika bez informacji o strefie", "W UTC w formacie ISO 8601, np. `2026-11-23T14:30:00Z`", "Jako polski zapis `23/11/2026`"], "poprawna": 2, "wyjasnienie": "UTC i ISO 8601 są jednoznaczne i sortowalne. Konwersję do strefy użytkownika robi dopiero interfejs."}
{"id": "http-001", "kategoria": "http", "typ": "wybor", "pytanie": "Który kod HTTP oznacza, że zasób nie istnieje?", "opcje": ["400", "401", "404", "500"], "poprawna": 2, "wyjasnienie": "4xx to błędy klienta: 400 = źle zbudowane żądanie, 401 = brak uwierzytelnienia. 500 to błąd serwera."}
{"id": "http-002", "kategoria": "http", "typ": "fiszka", "pytanie": "Czym różni się GET od POST?", "odpowiedz": "GET pobiera dane, parametry idą w URL, powinien być bezpieczny i idempotentny. POST wysyła dane w ciele żądania i zwykle zmienia stan na serwerze."}
{"id": "http-101", "kategoria": "http", "typ": "fiszka", "pytanie": "PUT a PATCH – czym się różnią?", "odpowiedz": "`PUT` zastępuje cały zasób przesłaną reprezentacją (idempotentny). `PATCH` zmienia tylko wskazane pola, np. samo `email`."}
{"id": "http-102", "kategoria": "http", "typ": "wybor", "pytanie": "Do czego przeglądarka używa żądania preflight `OPTIONS`?", "opcje": ["Do pobrania pliku favicon", "Do sprawdzenia, czy serwer zezwala na żądanie cross-origin", "Do odświeżenia sesji", "Do usunięcia zasobu"], "poprawna": 1, "wyjasnienie": "Przed niektórymi żądaniami cross-origin (np. `PUT`, własne nagłówki) przeglądarka pyta `OPTIONS`, czy CORS na to pozwala."}
{"id": "http-103", "kategoria": "http", "typ": "fiszka", "pytanie": "Do czego służą nagłówki `Content-Type` i `Authorization`?", "odpowiedz": "`Content-Type` mówi, w jakim formacie jest body (np. `application/json`). `Authorization` niesie dane uwierzytelniające, np. `Bearer <token>`."}
{"id": "http-104", "kategoria": "http", "typ": "wybor", "pytanie": "Co oznacza `Cache-Control: no-store`?", "opcje": ["Odpowiedź ma być cache'owana przez rok", "Odpowiedź nie może być zapisywana w cache", "Cache ma sprawdzić ważność u serwera", "Odpowiedź jest tylko do odczytu"], "poprawna": 1, "wyjasnienie": "`no-store` zakazuje zapisu odpowiedzi w cache (wrażliwe dane). `no-cache` pozwala zapisać, ale wymaga rewalidacji; `max-age` ustala czas ważności."}
{"id": "http-105", "kategoria": "http", "typ": "fiszka", "pytanie": "Co zapewnia HTTPS (TLS)?", "odpowiedz": "Szyfrowanie ruchu, integralność danych i uwierzytelnienie serwera przez certyfikat. Nikt po drodze nie podejrzy ani nie zmieni treści żądań."}
{"id": "http-106", "kategoria": "http", "typ": "fiszka", "pytanie": "Co dzieje się po wpisaniu URL w przeglądarce? (w skrócie)", "odpowiedz": "DNS zamienia domenę na adres IP, następnie połączenie TCP i TLS, żądanie HTTP, odpowiedź serwera i renderowanie strony wraz z kolejnymi zasobami."}
{"id": "http-107", "kategoria": "http", "typ": "wybor", "pytanie": "Co ważnego wnosi HTTP/2 względem HTTP/1.1?", "opcje": ["Brak nagłówków", "Multipleksowanie wielu żądań w jednym połączeniu", "Zamianę JSON na XML", "Działanie bez TCP i IP"], "poprawna": 1, "wyjasnienie": "HTTP/2 przesyła wiele żądań równolegle jednym połączeniem, kompresuje nagłówki i jest binarny. Semantyka (metody, kody) zostaje ta sama."}
{"id": "http-108", "kategoria": "http", "typ": "fiszka", "pytanie": "Co znaczy, że HTTP jest bezstanowy?", "odpowiedz": "Każde żądanie jest niezależne: serwer nie pamięta poprzednich. Stan (logowanie) przenosi się przez ciasteczka, sesje lub tokeny w każdym żądaniu."}
{"id": "http-109", "kategoria": "http", "typ": "wybor", "pytanie": "Który kod oznacza stałe przeniesienie zasobu pod nowy adres?", "opcje": ["`301`", "`302`", "`304`", "`307`"], "poprawna": 0, "wyjasnienie": "`301 Moved Permanently` to stałe przekierowanie (adres w `Location`). `302` i `307` są tymczasowe, `304` oznacza „nie zmieniono”."}
{"id": "http-110", "kategoria": "http", "typ": "wybor", "pytanie": "Użytkownik jest zalogowany, ale nie ma uprawnień do zasobu. Jaki kod?", "opcje": ["`400`", "`401`", "`404`", "`403`"], "poprawna": 3, "wyjasnienie": "`403 Forbidden`: wiemy, kim jesteś, ale nie wolno. `401 Unauthorized` oznacza brak lub zły dowód tożsamości."}
{"id": "http-111", "kategoria": "http", "typ": "wybor", "pytanie": "Jaki kod zwrócić po udanym `DELETE`, bez treści w odpowiedzi?", "opcje": ["`200` z body", "`201`", "`204`", "`202`"], "poprawna": 2, "wyjasnienie": "`204 No Content` oznacza sukces bez body. `201 Created` jest po utworzeniu zasobu (z `Location`), `202` po przyjęciu do późniejszego przetworzenia."}
{"id": "http-112", "kategoria": "http", "typ": "fiszka", "pytanie": "Parametr ścieżki a query – kiedy którego użyć?", "odpowiedz": "Ścieżka identyfikuje zasób: `/users/42`. Query dopracowuje widok kolekcji: `/users?role=admin&page=2` (filtry, sortowanie, paginacja)."}
{"id": "http-201", "kategoria": "http", "typ": "fiszka", "pytanie": "Jak działa `ETag` z `If-None-Match` i kiedy pojawia się `304`?", "odpowiedz": "Serwer wysyła `ETag` (odcisk wersji zasobu). Klient odsyła go w `If-None-Match`. Jeśli zasób się nie zmienił, serwer odpowiada `304 Not Modified` bez treści."}
{"id": "http-202", "kategoria": "http", "typ": "wybor", "pytanie": "Która wartość `SameSite` nie wysyła ciasteczka w żadnym żądaniu między witrynami?", "opcje": ["`Strict`", "`Lax`", "`None`", "`Secure`"], "poprawna": 0, "wyjasnienie": "`Lax` wysyła ciasteczko przy nawigacji najwyższego poziomu GET. `None` wysyła zawsze, ale wymaga `Secure`. `Secure` nie jest wartością `SameSite`."}
{"id": "http-203", "kategoria": "http", "typ": "fiszka", "pytanie": "Czym różni się `Content-Length` od `Transfer-Encoding: chunked`?", "odpowiedz": "`Content-Length` podaje rozmiar treści z góry. `chunked` (HTTP/1.1) wysyła treść kawałkami o nieznanym z góry rozmiarze, np. stream, kończąc kawałkiem o długości 0."}
{"id": "http-204", "kategoria": "http", "typ": "wybor", "pytanie": "Co daje trwałe połączenie (`keep-alive`) w HTTP/1.1?", "opcje": ["Utrzymanie sesji użytkownika po zamknięciu przeglądarki", "Kilka żądań po jednym połączeniu TCP, bez ponownego handshake'u", "Szyfrowanie połączenia", "Automatyczne ponawianie nieudanych żądań"], "poprawna": 1, "wyjasnienie": "Unika się kosztu TCP (i TLS) przy każdym żądaniu. W HTTP/1.1 jest domyślne, zamknięcie wymaga `Connection: close`."}
{"id": "http-205", "kategoria": "http", "typ": "fiszka", "pytanie": "Do czego służy nagłówek `Accept` i czym jest negocjacja treści?", "odpowiedz": "Klient podaje preferowane formaty, np. `Accept: application/json`. Serwer wybiera reprezentację albo zwraca `406 Not Acceptable`. Podobnie działa `Accept-Language`."}
{"id": "http-206", "kategoria": "http", "typ": "wybor", "pytanie": "Serwer jest chwilowo w konserwacji. Co zwrócić?", "opcje": ["`429 Too Many Requests`", "`500 Internal Server Error`", "`503 Service Unavailable` z nagłówkiem `Retry-After`", "`404 Not Found`"], "poprawna": 2, "wyjasnienie": "503 oznacza chwilową niedostępność, a `Retry-After` mówi, kiedy wrócić. 429 dotyczy przekroczenia limitu przez klienta."}
{"id": "http-207", "kategoria": "http", "typ": "fiszka", "pytanie": "Za reverse proxy (nginx) widzisz 500, 502 i 504. Co oznaczają?", "odpowiedz": "500: błąd w samej aplikacji. 502 Bad Gateway: proxy dostało niepoprawną odpowiedź lub aplikacja leży. 504 Gateway Timeout: aplikacja nie odpowiedziała w czasie."}
{"id": "http-208", "kategoria": "http", "typ": "wybor", "pytanie": "Co zwraca metoda HEAD?", "opcje": ["Tylko treść odpowiedzi, bez nagłówków", "Listę metod dozwolonych dla zasobu", "Treść pierwszych 100 bajtów zasobu", "Te same nagłówki co GET, ale bez treści odpowiedzi"], "poprawna": 3, "wyjasnienie": "Przydatne do sprawdzenia istnienia, rozmiaru lub `ETag` bez pobierania treści (`curl -I`). Listę metod zwraca `OPTIONS`."}
{"id": "http-209", "kategoria": "http", "typ": "fiszka", "pytanie": "Czym jest kodowanie URL (percent-encoding) i po co?", "odpowiedz": "Znaki specjalne zapisuje się jako `%XX`, np. spacja to `%20`, a `&` to `%26`. Dzięki temu wartości w ścieżce lub query nie psują struktury adresu. W Pythonie: `urllib.parse.quote`."}
{"id": "http-210", "kategoria": "http", "typ": "wybor", "pytanie": "Co wyśle `curl -d 'a=1&b=2' https://x.pl/api` bez flagi `-X`?", "opcje": ["`GET` z parametrami w adresie", "`POST` z `Content-Type: application/x-www-form-urlencoded`", "`PUT` z treścią JSON", "`POST` z `Content-Type: application/json`"], "poprawna": 1, "wyjasnienie": "Flaga `-d` domyślnie ustawia POST i typ formularza. Dla JSON dodaj `-H 'Content-Type: application/json'`. Z `-v` zobaczysz nagłówki."}
{"id": "projektowanie-201", "kategoria": "projektowanie", "typ": "fiszka", "pytanie": "Wymień 4 filary OOP i jak wyglądają w Pythonie.", "odpowiedz": "Enkapsulacja (`_x` to konwencja, brak prawdziwego `private`), dziedziczenie, polimorfizm (duck typing) i abstrakcja (`abc.ABC`, ukrywanie szczegółów za interfejsem)."}
{"id": "projektowanie-202", "kategoria": "projektowanie", "typ": "fiszka", "pytanie": "Na co zwracasz uwagę podczas code review?", "odpowiedz": "Poprawność i przypadki brzegowe, czytelność i nazwy, testy, brak duplikacji, bezpieczeństwo, wpływ na resztę kodu. Komentuj kod, nie osobę; pytaj zamiast rozkazywać."}
{"id": "projektowanie-203", "kategoria": "projektowanie", "typ": "fiszka", "pytanie": "Co oznacza SOLID? Wymień zasady jednym zdaniem każda.", "odpowiedz": "S: jedna odpowiedzialność. O: otwarte na rozszerzenie, zamknięte na modyfikację. L: podtyp zastępuje typ bazowy. I: małe interfejsy. D: zależność od abstrakcji."}
{"id": "projektowanie-204", "kategoria": "projektowanie", "typ": "wybor", "pytanie": "Klasa `Report` liczy dane, formatuje PDF i wysyła e-mail. Którą zasadę SOLID łamie?", "opcje": ["Open/Closed", "Liskov Substitution", "Interface Segregation", "Single Responsibility"], "poprawna": 3, "wyjasnienie": "Ma wiele powodów do zmiany (logika, format, wysyłka). Zgodnie z SRP rozdzielamy to na osobne klasy."}
{"id": "projektowanie-205", "kategoria": "projektowanie", "typ": "fiszka", "pytanie": "Na czym polega zasada Open/Closed? Podaj przykład w Pythonie.", "odpowiedz": "Nowe zachowanie dodajesz nowym kodem, bez edycji starego. Zamiast łańcucha `if/elif` po typie: klasy ze wspólną metodą albo słownik funkcji, do którego dopisujesz nowy wpis."}
{"id": "projektowanie-206", "kategoria": "projektowanie", "typ": "wybor", "pytanie": "Który przykład łamie zasadę podstawienia Liskov (LSP)?", "opcje": ["`Square(Rectangle)`, który zmienia szerokość i wysokość razem", "`Dog(Animal)` z dodatkową metodą `fetch()`", "Klasa z dwiema metodami publicznymi", "Podklasa wywołująca `super().__init__()`"], "poprawna": 0, "wyjasnienie": "Kod oczekujący `Rectangle` zakłada niezależne boki. Podklasa łamiąca to założenie nie może go bezpiecznie zastąpić."}
{"id": "projektowanie-207", "kategoria": "projektowanie", "typ": "fiszka", "pytanie": "Czym jest Dependency Inversion, a czym Dependency Injection?", "odpowiedz": "DIP: moduły wysokiego poziomu zależą od abstrakcji, nie od konkretów. DI: technika, w której zależność dostajesz z zewnątrz (np. w `__init__`), zamiast tworzyć ją w środku."}
{"id": "projektowanie-208", "kategoria": "projektowanie", "typ": "wybor", "pytanie": "Co oznaczają skróty DRY, KISS i YAGNI?", "opcje": ["Don't Repeat Yourself, Keep It Simple, You Aren't Gonna Need It", "Do Refactor Yearly, Keep It Short, You Always Need It", "Data Reuse Yield, Keep It Safe, Yield And Go Next", "Don't Rewrite Yet, Keep It Secure, You Aren't Gonna Ever"], "poprawna": 0, "wyjasnienie": "Nie powtarzaj wiedzy, trzymaj prostotę, nie pisz funkcji na zapas. Bez DRY na siłę: zła abstrakcja bywa gorsza od duplikacji."}
{"id": "projektowanie-209", "kategoria": "projektowanie", "typ": "fiszka", "pytanie": "Dlaczego „kompozycja zamiast dziedziczenia”?", "odpowiedz": "Dziedziczenie silnie wiąże podklasę z bazą i sztywno ustala hierarchię. Kompozycja (obiekt ma pole z innym obiektem) jest elastyczna, łatwiejsza do testów i podmiany."}
{"id": "projektowanie-210", "kategoria": "projektowanie", "typ": "fiszka", "pytanie": "Singleton: dlaczego w Pythonie to często antywzorzec?", "odpowiedz": "To ukryty globalny stan: utrudnia testy i zależności. W Pythonie moduł jest już singletonem (importowany raz), więc wystarczy obiekt na poziomie modułu albo DI."}
{"id": "projektowanie-211", "kategoria": "projektowanie", "typ": "wybor", "pytanie": "Masz kilka wymiennych algorytmów płatności wybieranych w runtime. Jaki wzorzec pasuje?", "opcje": ["Singleton", "Strategy", "Observer", "Facade"], "poprawna": 1, "wyjasnienie": "Strategy: rodzina wymiennych algorytmów za wspólnym interfejsem, wybierana w runtime. Factory zaś tylko tworzy obiekty."}
{"id": "projektowanie-212", "kategoria": "projektowanie", "typ": "fiszka", "pytanie": "Na czym polega wzorzec Observer? Podaj przykład.", "odpowiedz": "Obiekt (subject) powiadamia zarejestrowanych obserwatorów o zmianie, nie znając ich konkretnie. Przykłady: sygnały Django, event listenery w GUI, pub/sub."}
{"id": "projektowanie-213", "kategoria": "projektowanie", "typ": "wybor", "pytanie": "Czym wzorzec Decorator różni się od dekoratora `@` w Pythonie?", "opcje": ["To dokładnie to samo", "Wzorzec działa tylko na klasach abstrakcyjnych", "Wzorzec to obiekt-opakowanie; `@` to składnia dla funkcji i klas", "Wzorzec działa tylko w czasie kompilacji"], "poprawna": 2, "wyjasnienie": "Wzorzec dodaje zachowanie przez obiekt-opakowanie. `@dekorator` to cukier składniowy: `f = dekorator(f)`. Pokrewne, ale nie tożsame."}
{"id": "projektowanie-214", "kategoria": "projektowanie", "typ": "wybor", "pytanie": "Jak wygląda dobry projekt modułów pod względem coupling i cohesion?", "opcje": ["Wysoki coupling, niska cohesion", "Niski coupling, niska cohesion", "Wysoki coupling, wysoka cohesion", "Niski coupling, wysoka cohesion"], "poprawna": 3, "wyjasnienie": "Moduły mają być spójne w środku (cohesion) i luźno powiązane ze sobą (coupling), dzięki czemu zmiana w jednym mało psuje inne."}
{"id": "projektowanie-215", "kategoria": "projektowanie", "typ": "fiszka", "pytanie": "Wymień 3 code smells i jak je naprawić.", "odpowiedz": "Długa funkcja: wydziel mniejsze. Magic numbers: nazwane stałe. God class: podziel według odpowiedzialności. Inne: duplikacja, zbyt wiele parametrów."}
{"id": "projektowanie-216", "kategoria": "projektowanie", "typ": "fiszka", "pytanie": "Czym jest refaktoryzacja i czym jest dług techniczny?", "odpowiedz": "Refaktoryzacja: zmiana struktury kodu bez zmiany zachowania, zwykle pod osłoną testów. Dług techniczny: skróty, które dziś przyspieszają, ale podnoszą koszt późniejszych zmian."}
{"id": "projektowanie-217", "kategoria": "projektowanie", "typ": "fiszka", "pytanie": "Opisz piramidę testów i różnicę między testem jednostkowym a integracyjnym.", "odpowiedz": "Dużo szybkich unit testów (jedna jednostka, izolowana), mniej integracyjnych (współpraca modułów, np. z bazą), najmniej e2e (cały system, wolne, kruche)."}
{"id": "projektowanie-218", "kategoria": "projektowanie", "typ": "wybor", "pytanie": "Jaka jest kolejność cyklu TDD?", "opcje": ["Refactor, Green, Red", "Green, Red, Refactor", "Red, Green, Refactor", "Red, Refactor, Green"], "poprawna": 2, "wyjasnienie": "Najpierw test, który nie przechodzi (Red), potem minimalny kod (Green), na końcu porządkowanie przy zielonych testach (Refactor)."}
{"id": "projektowanie-219", "kategoria": "projektowanie", "typ": "fiszka", "pytanie": "Mock a stub w testach: na czym polega różnica?", "odpowiedz": "Stub zwraca z góry ustalone dane, żeby test mógł działać. Mock dodatkowo weryfikuje interakcje, np. czy metoda została wywołana z oczekiwanymi argumentami."}
{"id": "projektowanie-220", "kategoria": "projektowanie", "typ": "wybor", "pytanie": "Co mówi pokrycie testami (coverage) równe 100%?", "opcje": ["Że kod nie ma błędów", "Że każda linia została wykonana w testach, nie że sprawdzona", "Że testy pokrywają wszystkie przypadki", "Że kod jest zgodny z wymaganiami"], "poprawna": 1, "wyjasnienie": "Coverage mierzy wykonany kod, nie jakość asercji. Niskie pokrycie wskazuje luki, wysokie nie gwarantuje poprawności."}
{"id": "git-001", "kategoria": "git", "typ": "fiszka", "pytanie": "Czym różni się `git merge` od `git rebase`?", "odpowiedz": "Merge łączy gałęzie commitem scalającym i nie zmienia historii. Rebase przenosi twoje commity na nową bazę: historia jest liniowa, ale commity dostają nowe hashe."}
{"id": "git-002", "kategoria": "git", "typ": "wybor", "pytanie": "Co robi `git stash`?", "opcje": ["Usuwa niezatwierdzone zmiany na zawsze", "Odkłada niezatwierdzone zmiany na bok, żeby wrócić do nich później", "Tworzy nową gałąź z bieżących zmian"], "poprawna": 1, "wyjasnienie": "Zmiany wracają przez `git stash pop`, listę pokazuje `git stash list`."}
{"id": "git-101", "kategoria": "git", "typ": "fiszka", "pytanie": "Czym różnią się katalog roboczy, staging area i commit w Gicie?", "odpowiedz": "Katalog roboczy to Twoje pliki na dysku. `git add` przenosi zmiany do staging (index), czyli listy do następnego commita. `git commit` zapisuje ją w historii."}
{"id": "git-102", "kategoria": "git", "typ": "wybor", "pytanie": "Co robi `git reset --hard HEAD~1`?", "opcje": ["Tworzy nowy commit odwracający ostatni", "Cofa commit, a zmiany zostają w katalogu roboczym", "Cofa commit, ale zostawia zmiany w staging", "Cofa commit i usuwa zmiany także z indeksu i katalogu roboczego"], "poprawna": 3, "wyjasnienie": "`--soft` zostawia zmiany w staging, `--mixed` (domyślny) w katalogu roboczym, `--hard` kasuje je całkowicie."}
{"id": "git-103", "kategoria": "git", "typ": "fiszka", "pytanie": "Czym różni się `git revert` od `git reset`?", "odpowiedz": "`revert` tworzy nowy commit odwracający zmiany, więc historia zostaje (bezpieczny dla wspólnych gałęzi). `reset` przesuwa wskaźnik gałęzi i przepisuje historię."}
{"id": "git-104", "kategoria": "git", "typ": "wybor", "pytanie": "Czym różni się `git fetch` od `git pull`?", "opcje": ["`fetch` pobiera zmiany bez scalania; `pull` to `fetch` + merge", "To dwie nazwy tego samego polecenia", "`pull` tylko pokazuje zmiany, `fetch` je scala", "`fetch` wysyła zmiany na serwer, `pull` je pobiera"], "poprawna": 0, "wyjasnienie": "`fetch` aktualizuje tylko zdalne referencje (np. `origin/main`). `pull` dodatkowo scala (lub robi rebase) do bieżącej gałęzi."}
{"id": "git-105", "kategoria": "git", "typ": "fiszka", "pytanie": "Skąd się bierze konflikt przy merge i jak go rozwiązać?", "odpowiedz": "Powstaje, gdy obie gałęzie zmieniły te same linie. Otwierasz plik ze znacznikami `<<<<<<<`, wybierasz właściwą wersję, robisz `git add`, potem `git commit`."}
{"id": "git-106", "kategoria": "git", "typ": "wybor", "pytanie": "Na czym polega trunk-based development w porównaniu z GitFlow?", "opcje": ["Krótkie gałęzie i częste merge'e do jednej głównej gałęzi", "Osobne długie gałęzie `develop`, `release` i `hotfix`", "Każdy programista pracuje na własnym forku bez merge", "Commity trafiają bezpośrednio na produkcję bez testów"], "poprawna": 0, "wyjasnienie": "Trunk-based: małe, szybko scalane zmiany do `main`, często z feature flagami. GitFlow ma długotrwałe gałęzie i bardziej złożony proces."}
{"id": "git-107", "kategoria": "git", "typ": "fiszka", "pytanie": "Czym jest pull request i po co robi się code review?", "odpowiedz": "PR to prośba o scalenie gałęzi, z miejscem na dyskusję i testy CI. Review wyłapuje błędy, dzieli wiedzę w zespole i pilnuje jakości oraz spójnego stylu kodu."}
{"id": "git-108", "kategoria": "git", "typ": "wybor", "pytanie": "Dodałeś plik do `.gitignore`, ale Git nadal go śledzi. Dlaczego?", "opcje": ["Trzeba użyć `git add -f` na tym pliku", "Pliki w `.gitignore` zawsze są śledzone, ale nie wysyłane", "Plik był już śledzony; trzeba go usunąć z indeksu: `git rm --cached`", "`.gitignore` działa dopiero po restarcie komputera"], "poprawna": 2, "wyjasnienie": "`.gitignore` dotyczy tylko plików nieśledzonych. Śledzony plik odepnij poleceniem `git rm --cached plik`."}
{"id": "git-109", "kategoria": "git", "typ": "fiszka", "pytanie": "Do czego służy `git cherry-pick`?", "odpowiedz": "Kopiuje wybrany commit z innej gałęzi na bieżącą jako nowy commit (z nowym hashem), bez scalania całej gałęzi. Przydatne np. do hotfixa."}
{"id": "git-110", "kategoria": "git", "typ": "wybor", "pytanie": "Czym jest `HEAD` w Gicie?", "opcje": ["Nazwą domyślnej gałęzi zdalnej", "Plikiem z listą ignorowanych plików", "Pierwszym commitem w repozytorium", "Wskaźnikiem na bieżący commit, zwykle przez aktualną gałąź"], "poprawna": 3, "wyjasnienie": "`HEAD` wskazuje, na czym aktualnie jesteś. Zwykle to czubek bieżącej gałęzi; `HEAD~1` to commit wcześniej."}
{"id": "git-111", "kategoria": "git", "typ": "fiszka", "pytanie": "Jak poprawić ostatni commit i kiedy to bezpieczne?", "odpowiedz": "`git commit --amend` zmienia treść lub wiadomość ostatniego commita (powstaje nowy hash). Bezpieczne tylko, gdy commit nie został jeszcze wypchnięty do wspólnej gałęzi."}
{"id": "git-112", "kategoria": "git", "typ": "wybor", "pytanie": "Dlaczego nie robi się `git push --force` na wspólnej gałęzi?", "opcje": ["Wymaga uprawnień administratora systemu", "Jest za wolne dla dużych repozytoriów", "Nadpisuje historię i może skasować cudze commity", "Usuwa wszystkie tagi z repozytorium"], "poprawna": 2, "wyjasnienie": "Force-push zastępuje historię na serwerze; koledzy tracą commity lub mają rozjechane repo. Bezpieczniej `--force-with-lease`, tylko na własnej gałęzi."}
{"id": "git-201", "kategoria": "git", "typ": "fiszka", "pytanie": "Co pokazuje `git log --oneline --graph --all` i kiedy się przydaje?", "odpowiedz": "Skrócone commity (jedna linia) z rysunkiem drzewa gałęzi, dla wszystkich gałęzi. Przydaje się do oceny, jak rozeszły się gałęzie przed merge lub rebase."}
{"id": "git-202", "kategoria": "git", "typ": "wybor", "pytanie": "Zmieniłeś plik i zrobiłeś `git add`. Co pokaże samo `git diff`?", "opcje": ["Wszystkie zmiany względem ostatniego commita", "Różnice między lokalną gałęzią a `origin`", "Nic dla tego pliku — pokazuje tylko zmiany niezaindeksowane", "Tylko zmiany w plikach nieśledzonych"], "poprawna": 2, "wyjasnienie": "`git diff` porównuje katalog roboczy ze staging area. Zmiany już dodane widać w `git diff --staged`."}
{"id": "git-203", "kategoria": "git", "typ": "fiszka", "pytanie": "Czym są `git switch` i `git restore` i dlaczego zastąpiły `git checkout`?", "odpowiedz": "`switch` przełącza gałęzie, `restore` cofa zmiany w plikach. `checkout` robił obie rzeczy naraz, co mylało i groziło utratą zmian."}
{"id": "git-204", "kategoria": "git", "typ": "fiszka", "pytanie": "Czym jest detached HEAD i jak nie stracić commitów zrobionych w tym stanie?", "odpowiedz": "HEAD wskazuje na konkretny commit, a nie na gałąź. Nowe commity nie mają gałęzi, więc zrób `git switch -c nazwa`, zanim przełączysz się gdzie indziej."}
{"id": "git-205", "kategoria": "git", "typ": "wybor", "pytanie": "Zrobiłeś `git reset --hard` i zgubiłeś commity. Jak je zwykle odzyskać?", "opcje": ["`git reflog`, znaleźć hash i `git reset --hard <hash>`", "`git log --all`, bo usunięte commity zawsze tam są", "`git stash pop`, który przywraca ostatnie commity", "Nie da się, `reset --hard` kasuje je trwale"], "poprawna": 0, "wyjasnienie": "Reflog zapisuje, gdzie był HEAD. Commity bez referencji żyją jeszcze jakiś czas, zanim zbierze je `git gc`."}
{"id": "git-206", "kategoria": "git", "typ": "fiszka", "pytanie": "Do czego służy `git bisect`?", "odpowiedz": "Do znalezienia commita, który wprowadził błąd. Oznaczasz commity jako good/bad, a Git wyszukuje binarnie, więc potrzeba log2(n) kroków."}
{"id": "git-207", "kategoria": "git", "typ": "wybor", "pytanie": "Czym różni się tag annotated (`git tag -a`) od lightweight?", "opcje": ["Lightweight jest wysyłany na zdalne repo, annotated tylko lokalnie", "Annotated może wskazywać tylko commity z gałęzi `main`", "Nie ma różnicy, `-a` tylko zmienia kolor w logu", "Annotated: pełny obiekt (autor, data, opis); lightweight: sam wskaźnik"], "poprawna": 3, "wyjasnienie": "Annotated nadaje się na wydania (wersje). Lightweight to tymczasowa zakładka, bez metadanych."}
{"id": "git-208", "kategoria": "git", "typ": "fiszka", "pytanie": "Jak wygląda dobry komunikat commita?", "odpowiedz": "Krótki temat w trybie rozkazującym (np. `Add login form`), do ok. 50 znaków. W treści wyjaśnij, dlaczego zmiana powstała — co zmieniono, widać w diffie."}
{"id": "git-209", "kategoria": "git", "typ": "fiszka", "pytanie": "Czym jest squash merge i jaka jest jego wada?", "odpowiedz": "Wszystkie commity gałęzi łączą się w jeden commit na docelowej gałęzi, więc historia jest czysta. Wada: tracisz szczegółową historię i autorstwo poszczególnych kroków."}
{"id": "git-210", "kategoria": "git", "typ": "wybor", "pytanie": "Do czego służy `git blame plik.py`?", "opcje": ["Wskazuje linie, które powodują konflikty merge", "Przy każdej linii: kto i w którym commicie ostatnio ją zmienił", "Cofa ostatnią zmianę wskazanego autora", "Pokazuje listę plików z błędami składni"], "poprawna": 1, "wyjasnienie": "Służy do zbadania kontekstu zmiany: z hasha przejdziesz do commita i jego opisu. Nie służy do szukania winnych."}
{"id": "sql-001", "kategoria": "sql", "typ": "fiszka", "pytanie": "Czym różni się `WHERE` od `HAVING`?", "odpowiedz": "WHERE filtruje wiersze przed grupowaniem. HAVING filtruje grupy po GROUP BY, więc można w nim używać agregatów, np. HAVING COUNT(*) > 5."}
{"id": "sql-002", "kategoria": "sql", "typ": "fiszka", "pytanie": "Co to jest klucz obcy?", "odpowiedz": "Kolumna, która wskazuje na klucz główny innej tabeli. Baza pilnuje, żeby nie wskazywała na nieistniejący wiersz."}
{"id": "sql-101", "kategoria": "sql", "typ": "fiszka", "pytanie": "Czym różni się `INNER JOIN` od `LEFT JOIN`?", "odpowiedz": "`INNER JOIN` zwraca tylko wiersze z dopasowaniem w obu tabelach. `LEFT JOIN` zwraca wszystkie wiersze z lewej, a brak dopasowania daje `NULL` po prawej."}
{"id": "sql-102", "kategoria": "sql", "typ": "wybor", "pytanie": "Jaka jest główna wada indeksu na kolumnie?", "opcje": ["Blokuje dostęp do tabeli dla innych użytkowników", "Uniemożliwia użycie `WHERE` na tej kolumnie", "Spowalnia `INSERT`/`UPDATE` i zajmuje miejsce", "Zmienia typ danych kolumny"], "poprawna": 2, "wyjasnienie": "Indeks przyspiesza odczyt (`WHERE`, `JOIN`, `ORDER BY`), ale każdy zapis musi go aktualizować, a on sam zajmuje pamięć."}
{"id": "sql-103", "kategoria": "sql", "typ": "fiszka", "pytanie": "Czym jest klucz główny (primary key)?", "odpowiedz": "Kolumna (lub zestaw kolumn) jednoznacznie identyfikująca wiersz. Musi być unikalna i nie może być `NULL`; w tabeli jest tylko jeden."}
{"id": "sql-104", "kategoria": "sql", "typ": "wybor", "pytanie": "Co zwróci `SELECT dzial, COUNT(*) FROM pracownicy GROUP BY dzial`?", "opcje": ["Liczbę pracowników w każdym dziale", "Błąd, bo brakuje klauzuli `WHERE`", "Łączną liczbę wierszy w tabeli", "Nazwę działu z największą liczbą osób"], "poprawna": 0, "wyjasnienie": "`GROUP BY` grupuje wiersze po `dzial`, a `COUNT(*)` liczy wiersze w każdej grupie."}
{"id": "sql-105", "kategoria": "sql", "typ": "fiszka", "pytanie": "Na czym polegają 1NF, 2NF i 3NF (podstawowo)?", "odpowiedz": "1NF: wartości atomowe, bez list w komórce. 2NF: brak zależności od części klucza złożonego. 3NF: brak zależności między kolumnami niekluczowymi."}
{"id": "sql-106", "kategoria": "sql", "typ": "wybor", "pytanie": "Które polecenie usuwa całą tabelę razem ze strukturą?", "opcje": ["`TRUNCATE TABLE`", "`DROP TABLE`", "`DELETE FROM` bez `WHERE`", "`ALTER TABLE`"], "poprawna": 1, "wyjasnienie": "`DROP` usuwa tabelę razem ze strukturą. `TRUNCATE` szybko czyści wszystkie wiersze, ale tabela zostaje. `DELETE` usuwa wiersze wybrane przez `WHERE`."}
{"id": "sql-107", "kategoria": "sql", "typ": "fiszka", "pytanie": "Co oznacza skrót ACID w transakcjach?", "odpowiedz": "Atomicity (wszystko albo nic), Consistency (zachowane reguły danych), Isolation (transakcje nie wchodzą sobie w drogę), Durability (zatwierdzone dane przetrwają awarię)."}
{"id": "sql-108", "kategoria": "sql", "typ": "wybor", "pytanie": "Jak poprawnie sprawdzić, czy kolumna `email` jest pusta (`NULL`)?", "opcje": ["`WHERE email EQUALS NULL`", "`WHERE email = NULL`", "`WHERE email IS NULL`", "`WHERE email == 0`"], "poprawna": 2, "wyjasnienie": "`NULL` oznacza brak wartości, a porównanie `= NULL` daje wynik nieznany. Zawsze używamy `IS NULL` lub `IS NOT NULL`."}
{"id": "sql-109", "kategoria": "sql", "typ": "fiszka", "pytanie": "Czym jest ograniczenie `UNIQUE` i czym różni się od klucza głównego?", "odpowiedz": "`UNIQUE` wymusza brak duplikatów w kolumnie. W tabeli może ich być wiele i zwykle dopuszcza `NULL`, a klucz główny jest jeden i `NULL` wyklucza."}
{"id": "sql-110", "kategoria": "sql", "typ": "wybor", "pytanie": "Kiedy bazę NoSQL wybierzesz zamiast relacyjnej?", "opcje": ["Gdy nie chcesz używać żadnego serwera", "Gdy dane mają elastyczny schemat i trzeba skalować poziomo", "Gdy potrzebne są złożone `JOIN`-y i transakcje ACID", "Gdy dane są ściśle tabelaryczne i stałe"], "poprawna": 1, "wyjasnienie": "NoSQL (np. MongoDB) sprawdza się przy elastycznym schemacie i dużej skali. Relacyjne bazy lepsze są przy złożonych relacjach i spójności."}
{"id": "sql-111", "kategoria": "sql", "typ": "fiszka", "pytanie": "Na czym polega problem N+1 zapytań?", "odpowiedz": "Jedno zapytanie pobiera N rekordów, a potem dla każdego leci osobne zapytanie (np. o powiązane dane): razem N+1. Rozwiązanie: `JOIN` lub eager loading."}
{"id": "sql-112", "kategoria": "sql", "typ": "wybor", "pytanie": "Kiedy zwykle wolisz `JOIN` zamiast podzapytania?", "opcje": ["`JOIN` jest zawsze wolniejszy", "Gdy chcesz tylko jedną wartość skalarną", "Gdy potrzebujesz kolumn z obu tabel w wyniku", "Gdy tabela nie ma żadnego klucza"], "poprawna": 2, "wyjasnienie": "`JOIN` zwraca kolumny z obu tabel. Podzapytanie świetnie nadaje się do filtrowania (`IN`, `EXISTS`) lub wartości skalarnych; optymalizator często robi z nich to samo."}
{"id": "sql-113", "kategoria": "sql", "typ": "fiszka", "pytanie": "Co zwraca `SELECT MAX(cena) FROM produkty WHERE kategoria = 'AGD'`?", "odpowiedz": "Jedną wartość: najwyższą cenę wśród produktów z kategorii AGD (lub `NULL`, jeśli takich produktów nie ma)."}
{"id": "sql-114", "kategoria": "sql", "typ": "wybor", "pytanie": "Co zwraca `SELECT name FROM users ORDER BY age DESC LIMIT 1`?", "opcje": ["Imię najstarszego użytkownika", "Wiek najstarszego użytkownika", "Imię najmłodszego użytkownika", "Imiona wszystkich użytkowników posortowane"], "poprawna": 0, "wyjasnienie": "`ORDER BY age DESC` sortuje malejąco, więc pierwszy wiersz to najstarszy. `LIMIT 1` zostawia tylko jego, a `SELECT` pokazuje `name`."}
